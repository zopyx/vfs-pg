[project]
name = "vfs-pg"
version = "0.1.0"
description = "PostgreSQL storage provider for chuk-virtual-fs + fsspec adapter (prototype)"
requires-python = ">=3.12"
dependencies = [
    "chuk-virtual-fs>=0.5.3",
    "fsspec>=2024.9",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chuk_vfs_postgres", "src/chuk_fsspec"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
