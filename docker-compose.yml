services:
  postgres:
    image: postgres:16-alpine
    container_name: vfs-pg-postgres
    environment:
      POSTGRES_USER: vfs
      POSTGRES_PASSWORD: vfs
      POSTGRES_DB: vfs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vfs -d vfs"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - vfs_pg_data:/var/lib/postgresql/data

volumes:
  vfs_pg_data:
